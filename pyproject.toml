[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Turn long videos into vertical 9:16 short-form clips (headless CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openai>=1.0.0",
    "yt-dlp>=2026.8.19",
    # The same OpenCV distribution mediapipe requires, so installing the `face` extra
    # never puts two packages that both provide `cv2` side by side (they overwrite
    # each other's files).
    "opencv-contrib-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    # CA bundle for HTTPS. Python from python.org on macOS ships without one, and
    # clipper.cli.ensure_ca_certificates() falls back to this. Declared directly because
    # it is not guaranteed to arrive as a dependency of something else.
    "certifi",
]

[project.optional-dependencies]
# Face-tracked reframing. Optional because MediaPipe's current releases only ship
# macOS wheels for Apple Silicon; Intel Macs need Python 3.9-3.12 (mediapipe 0.10.21).
face = ["mediapipe>=0.10.0"]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
