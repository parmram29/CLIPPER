[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Turn long videos into vertical 9:16 short-form clips (headless CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openai>=1.0.0",
    "yt-dlp>=2026.8.19",
    # cv2 comes from mediapipe's own opencv-contrib-python dependency. Declaring
    # opencv-python / opencv-python-headless as well would install two packages
    # that both provide `cv2` and overwrite each other's files.
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "mediapipe>=0.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
